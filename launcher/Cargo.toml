[package]
name = "pmac"
version = "0.1.0"
edition = "2021"
description = "Proton-macOS launcher: Steam library, Windows depots, Proton runs and Steam shortcuts"
license = "BSD-3-Clause"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
